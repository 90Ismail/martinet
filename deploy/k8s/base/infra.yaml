# Kafka, managed by the Strimzi operator that Terraform installs
# (terraform/modules/platform). The message queue is our own (mq.yaml).
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    strimzi.io/cluster: martinet
spec:
  replicas: 3
  roles: [controller, broker] # KRaft: no ZooKeeper; Raft quorum in the brokers
  storage:
    type: persistent-claim
    size: 20Gi
    deleteClaim: false
  resources:
    requests: { cpu: 250m, memory: 1Gi }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: martinet
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      # RF=3 + min ISR 2 + producer acks=all: an acked write survives any
      # single broker loss, and the cluster still accepts writes with one
      # broker down (DDIA ch. 5: replication, quorums).
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      unclean.leader.election.enable: false # never elect an out-of-date replica
      auto.create.topics.enable: false
    rack:
      topologyKey: topology.kubernetes.io/zone
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: events
  labels: { strimzi.io/cluster: martinet }
spec:
  partitions: 12
  replicas: 3
  config: { retention.ms: 604800000, min.insync.replicas: 2 }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: events.dlq
  labels: { strimzi.io/cluster: martinet }
spec:
  partitions: 3
  replicas: 3
  config: { retention.ms: 2592000000 }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: attempts
  labels: { strimzi.io/cluster: martinet }
spec:
  partitions: 12
  replicas: 3
  config: { retention.ms: 604800000 }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: endpoint-health
  labels: { strimzi.io/cluster: martinet }
spec:
  partitions: 3
  replicas: 3
  config: { cleanup.policy: compact, min.compaction.lag.ms: 60000 }
