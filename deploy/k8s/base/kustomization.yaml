apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: martinet
labels:
  - pairs: { app.kubernetes.io/part-of: martinet }
resources:
  - namespace.yaml
  - infra.yaml
  - mq.yaml
  - carnet.yaml
  - services.yaml
  - sink.yaml
images:
  - name: martinet-go
    newName: martinet-go
    newTag: dev
  - name: martinet-cpp
    newName: martinet-cpp
    newTag: dev
